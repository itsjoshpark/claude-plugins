name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node so the pnpm binary is on PATH first.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      # No `cache: pnpm` — this repo has no lockfile, and setup-node's cache
      # fails outright when it can't find one.
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Claude Code CLI
        run: pnpm add -g @anthropic-ai/claude-code

      # `claude plugin validate` reads local manifests only — no auth required.
      # --strict promotes warnings (missing version, unrecognized fields) to errors.
      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate plugin manifests
        run: |
          for dir in plugins/*/; do
            echo "::group::${dir}"
            claude plugin validate "${dir}" --strict
            echo "::endgroup::"
          done
